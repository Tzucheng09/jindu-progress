<!doctype html><n<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183f35"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="💰進度"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>💰進度</title></head><body><header><div><small>MY FINANCE</small><h1>💰進度</h1><p>讓每一筆錢，都有自己的方向</p></div><span class="avatar">💰</span></header><main><section class="hero"><p>目前可用餘額</p><h2 id="balance">NT$ 0</h2><div class="stats"><div><small>本月收入</small><b id="income">$0</b></div><div><small>本月支出</small><b id="expense">$0</b></div></div></section><section><div class="section-title"><h3>財務概況</h3><span>目前資料</span></div><div class="tiles"><article><small>信貸剩餘</small><b id="credit">$600,000</b><em>年利率 7%</em></article><article><small>學貸剩餘</small><b id="student">$337,650</b><em>每月 $4,500</em></article><article><small>總負債</small><b id="debt">$937,650</b><em>持續往下降</em></article><article><small>緊急預備金</small><b id="saving">$0</b><em>目標 $93,747</em></article></div></section><section><div class="section-title"><h3>快速記帳</h3><span>資料存在此裝置</span></div><form id="entry"><div class="row"><select id="kind"><option value="expense">支出</option><option value="income">收入</option><option value="pending">待入帳佣金</option></select><input id="amount" type="number" min="1" placeholder="金額（元）" required></div><input id="note" placeholder="備註，例如：餐費、佣金" maxlength="40"><button>新增紀錄</button></form></section><section><div class="section-title"><h3>最近紀錄</h3><button class="link" id="clear">清空紀錄</button></div><ul id="entries" class="entries"><li class="empty">目前還沒有記帳紀錄</li></ul></section><section class="notice"><b>財務小提醒</b><p>先建立緊急預備金，再考慮提前還款。待入帳佣金不會算進可用現金。</p></section></main><nav><a class="active">⌂<small>總覽</small></a><a href="#entry">＋<small>記帳</small></a><a href="#debt">▤<small>債務</small></a><a href="#saving">◎<small>目標</small></a></nav><script src="app.js"></script></body></html>
